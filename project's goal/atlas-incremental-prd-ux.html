<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Incremental PRD UX</title>
  <meta name="description" content="Buyer-first UX prototype for understanding, verifying, and comparing incremental PRDs.">
  <style>

:root {
  --navy: #12313a;
  --navy-2: #1b414a;
  --ink: #18333c;
  --muted: #69797d;
  --faint: #94a0a2;
  --canvas: #f2f4f0;
  --paper: #ffffff;
  --line: #dfe5e2;
  --green: #26745f;
  --green-soft: #e8f4ee;
  --coral: #e46e50;
  --coral-soft: #fff0eb;
  --gold: #b87f26;
  --gold-soft: #fff6df;
  --blue-soft: #e9f1f3;
  --sidebar-width: 292px;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--canvas); color: var(--ink); font-family: Arial, Arial, sans-serif; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid rgba(228,110,80,.35); outline-offset: 3px; }

.atlas-shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar-width) 1fr; transition: grid-template-columns .24s ease; }
.atlas-shell.sidebar-collapsed { --sidebar-width: 76px; }
.atlas-sidebar { position: sticky; top: 0; z-index: 20; height: 100vh; min-width: 0; display: flex; flex-direction: column; background: var(--navy); color: white; border-right: 1px solid rgba(255,255,255,.08); box-shadow: 8px 0 24px rgba(13,36,43,.08); }
.sidebar-brand { height: 74px; display: flex; align-items: center; gap: 12px; padding: 0 17px; border-bottom: 1px solid rgba(255,255,255,.09); }
.brand-diamond { width: 37px; height: 37px; flex: 0 0 37px; display: grid; place-items: center; transform: rotate(45deg); border: 1px solid #afc4c3; border-radius: 9px; box-shadow: inset 0 0 0 3px var(--navy); background: #f4f7f4; }
.brand-diamond span { transform: rotate(-45deg); color: var(--navy); font-weight: 800; font-size: 14px; }
.sidebar-brand > div:nth-child(2) { min-width: 0; display: flex; flex-direction: column; }
.sidebar-brand b { font-size: 14px; letter-spacing: .15em; }
.sidebar-brand small { margin-top: 2px; color: #93abad; font-size: 9px; white-space: nowrap; }
.collapse-button { width: 25px; height: 28px; margin-left: auto; border: 1px solid rgba(255,255,255,.15); border-radius: 8px; background: rgba(255,255,255,.06); color: #b8c9ca; cursor: pointer; }
.sidebar-collapsed .sidebar-brand { padding: 0 19px; }
.sidebar-collapsed .collapse-button { position: absolute; left: 63px; top: 24px; width: 24px; background: var(--paper); color: var(--navy); box-shadow: 0 4px 10px rgba(12,36,42,.15); }

.project-switcher-wrap { position: relative; padding: 15px 13px 10px; }
.project-switcher { width: 100%; min-height: 69px; display: flex; align-items: center; gap: 11px; padding: 10px; border: 1px solid rgba(255,255,255,.12); border-radius: 13px; background: rgba(255,255,255,.06); color: white; text-align: left; cursor: pointer; }
.project-switcher:hover { background: rgba(255,255,255,.09); }
.project-monogram { width: 37px; height: 37px; flex: 0 0 37px; display: grid; place-items: center; border-radius: 11px; background: #e7f1ed; color: var(--green); font-weight: 800; }
.project-switcher > div { min-width: 0; display: flex; flex: 1; flex-direction: column; }
.project-switcher small { color: #8ca6a8; font: 700 7px "Courier New", monospace; letter-spacing: .1em; }
.project-switcher b { margin-top: 3px; font-size: 13px; }
.project-switcher em { margin-top: 3px; color: #a9babc; font-size: 8px; font-style: normal; white-space: nowrap; }
.project-switcher > i { color: #9bb0b1; font-style: normal; }
.sidebar-collapsed .project-switcher-wrap { padding: 15px 10px; }
.sidebar-collapsed .project-switcher { justify-content: center; min-height: 54px; padding: 7px; border: 0; background: transparent; }
.project-menu { position: absolute; left: 13px; right: 13px; top: 91px; z-index: 40; padding: 10px; border: 1px solid #d5dfdc; border-radius: 14px; background: white; color: var(--ink); box-shadow: 0 20px 50px rgba(7,29,35,.27); }
.project-menu-head { display: flex; justify-content: space-between; padding: 5px 6px 10px; }
.project-menu-head b { font-size: 10px; }
.project-menu-head span { color: var(--muted); font-size: 8px; }
.project-menu > button { width: 100%; display: grid; grid-template-columns: 31px 1fr auto; gap: 9px; align-items: center; padding: 9px; border: 0; border-radius: 9px; background: transparent; text-align: left; }
.project-menu > button.current { background: var(--green-soft); }
.project-menu > button > span { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: #edf1ef; font-size: 10px; font-weight: 750; }
.project-menu > button > div { display: flex; flex-direction: column; }
.project-menu > button b { font-size: 9px; }
.project-menu > button small { margin-top: 2px; color: var(--muted); font-size: 7px; }
.project-menu > button i { color: var(--green); font-size: 7px; font-style: normal; }
.project-menu > button:disabled { opacity: .55; }
.project-menu > p { margin: 8px 6px 3px; color: var(--muted); font-size: 7px; line-height: 1.45; }

.sidebar-section { padding: 13px 11px 5px; }
.sidebar-label { padding: 0 10px 8px; color: #6f9295; font: 700 7px "Courier New", monospace; letter-spacing: .13em; }
.nav-item { position: relative; width: 100%; min-height: 58px; display: flex; align-items: center; gap: 12px; padding: 8px 10px; border: 0; border-radius: 11px; background: transparent; color: #b9c9ca; text-align: left; cursor: pointer; }
.nav-item:hover { background: rgba(255,255,255,.05); color: white; }
.nav-item.active { background: rgba(255,255,255,.10); color: white; box-shadow: inset 3px 0 0 var(--coral); }
.nav-item > span { width: 28px; height: 28px; flex: 0 0 28px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.15); border-radius: 8px; color: #89a3a5; font: 650 8px "Courier New", monospace; }
.nav-item.active > span { border-color: var(--coral); background: var(--coral); color: white; }
.nav-item > div { min-width: 0; display: flex; flex: 1; flex-direction: column; }
.nav-item b { font-size: 11px; }
.nav-item small { margin-top: 3px; overflow: hidden; color: #789799; font-size: 8px; white-space: nowrap; text-overflow: ellipsis; }
.nav-item em { min-width: 18px; height: 18px; display: grid; place-items: center; border-radius: 9px; background: var(--coral); color: white; font-size: 7px; font-style: normal; }
.sidebar-collapsed .sidebar-section { padding: 10px; }
.sidebar-collapsed .nav-item { justify-content: center; min-height: 50px; padding: 6px; }

.source-section { margin-top: 8px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.08); }
.source-toggle { width: 100%; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border: 0; background: transparent; color: #8ca6a8; text-align: left; cursor: pointer; }
.source-toggle > span { width: 28px; text-align: center; font-size: 17px; }
.source-toggle b { flex: 1; color: #aebfc0; font-size: 9px; font-weight: 600; }
.source-toggle i { font-style: normal; }
.source-list { margin-top: 5px; padding-left: 8px; }
.source-list > button { position: relative; width: 100%; display: grid; grid-template-columns: 31px 1fr; gap: 8px; align-items: center; margin-bottom: 3px; padding: 8px 7px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: #aebfc0; text-align: left; cursor: pointer; }
.source-list > button:hover, .source-list > button.selected { border-color: rgba(255,255,255,.1); background: rgba(255,255,255,.06); color: white; }
.doc-icon { width: 28px; height: 31px; display: grid; place-items: center; border: 1px solid #719093; border-radius: 4px; color: #9db1b2; font: 650 8px "Courier New", monospace; box-shadow: 2px 2px 0 rgba(255,255,255,.06); }
.source-list > button > div { min-width: 0; display: flex; flex-direction: column; }
.source-list b { overflow: hidden; font-size: 8px; white-space: nowrap; text-overflow: ellipsis; }
.source-list small { margin-top: 3px; overflow: hidden; color: #718f92; font-size: 7px; white-space: nowrap; text-overflow: ellipsis; }
.source-list em { position: absolute; right: 7px; top: 6px; padding: 2px 4px; border-radius: 5px; background: var(--green); color: white; font-size: 5px; font-style: normal; text-transform: uppercase; }

.sidebar-footer { margin-top: auto; min-height: 67px; display: flex; align-items: center; gap: 10px; padding: 13px 19px; border-top: 1px solid rgba(255,255,255,.08); }
.status-dot { width: 9px; height: 9px; flex: 0 0 9px; border: 3px solid #91bea9; border-radius: 50%; background: #3fa77e; box-shadow: 0 0 0 4px rgba(63,167,126,.12); }
.sidebar-footer > div { display: flex; flex-direction: column; }
.sidebar-footer b { font-size: 9px; }
.sidebar-footer small { margin-top: 3px; color: #78979a; font-size: 7px; }

.atlas-content { position: relative; isolation: isolate; min-width: 0; min-height: 100vh; display: flex; flex-direction: column; }
.content-header { position: relative; z-index: 100; height: 74px; flex: 0 0 74px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 34px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.92); backdrop-filter: blur(12px); }
.breadcrumb { min-width: 0; display: flex; align-items: center; gap: 6px; overflow: hidden; }
.breadcrumb span { min-width: 0; display: flex; align-items: center; gap: 6px; }
.breadcrumb button { max-width: 240px; overflow: hidden; border: 0; background: transparent; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.breadcrumb span:last-child button { color: var(--ink); font-weight: 700; }
.breadcrumb i { color: #b4bdbc; font-style: normal; font-size: 9px; }
.header-actions { display: flex; align-items: center; gap: 8px; }
.active-filter { height: 33px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border: 1px solid #afd0c1; border-radius: 17px; background: var(--green-soft); color: var(--green); font-size: 8px; cursor: pointer; }
.active-filter span { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.active-filter i { margin-left: 3px; font-style: normal; }
.icon-button, .user-button { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: white; cursor: pointer; }
.user-button { border-radius: 50%; background: var(--navy); color: white; font-size: 9px; }
.content-scroll { position: relative; z-index: 0; flex: 1; min-height: 0; }
.view-page { width: min(1420px, calc(100% - 64px)); margin: 0 auto; padding: 42px 0 70px; }
.eyebrow { margin: 0 0 10px; color: var(--coral); font: 700 8px "Courier New", monospace; letter-spacing: .13em; }
.page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
.page-heading h1, .detail-title h1 { margin: 0; font-size: clamp(31px, 3vw, 48px); line-height: 1.04; letter-spacing: -.047em; }
.page-heading > div:first-child > p:last-child, .detail-title > p:last-child { max-width: 720px; margin: 14px 0 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
.overview-summary { display: flex; gap: 8px; }
.overview-summary > div { min-width: 105px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: white; display: flex; flex-direction: column; }
.overview-summary strong { font-size: 23px; line-height: 1; }
.overview-summary span { margin-top: 5px; color: var(--muted); font-size: 8px; }

.impact-banner { margin-top: 27px; display: grid; grid-template-columns: 33px 1fr auto; align-items: center; gap: 12px; padding: 13px 15px; border: 1px solid #aad0bf; border-radius: 13px; background: #eff8f3; }
.impact-symbol { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 8px; background: var(--green); color: white; }
.impact-banner b { font-size: 10px; }
.impact-banner p { margin: 3px 0 0; color: var(--muted); font-size: 8px; }
.impact-banner button { border: 0; background: transparent; color: var(--green); font-size: 8px; font-weight: 700; cursor: pointer; }

.major-flow { display: flex; align-items: stretch; margin: 46px 0 27px; }
.major-slot { min-width: 0; flex: 1; display: flex; align-items: center; transition: opacity .2s ease, filter .2s ease; }
.major-flow.filtering .major-slot.dimmed { opacity: .28; filter: grayscale(.8); }
.module-card { position: relative; width: 100%; min-height: 270px; display: flex; flex-direction: column; padding: 20px 18px 0; overflow: hidden; border: 1px solid #d7dfdc; border-radius: 16px; background: white; text-align: left; cursor: pointer; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
.module-card:hover { z-index: 2; transform: translateY(-4px); border-color: #9db3ab; box-shadow: 0 18px 35px rgba(23,48,56,.10); }
.major-flow.filtering .major-slot.affected .module-card { border-color: #5aa58b; box-shadow: 0 0 0 4px #e5f2ec; }
.module-top { min-height: 20px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.module-top > span { color: var(--coral); font: 700 9px "Courier New", monospace; letter-spacing: .1em; }
.module-top em { padding: 4px 6px; border-radius: 6px; background: var(--green); color: white; font: 700 5px "Courier New", monospace; letter-spacing: .06em; font-style: normal; white-space: nowrap; }
.module-copy { margin-top: 28px; }
.module-copy h2 { margin: 0; min-height: 42px; font-size: 15px; line-height: 1.3; letter-spacing: -.02em; }
.module-copy p { margin: 8px 0 0; color: var(--muted); font-size: 9px; line-height: 1.45; }
.module-outcome { margin-top: 24px; padding-top: 13px; border-top: 1px solid #edf0ee; display: flex; flex-direction: column; }
.module-outcome small { color: var(--faint); font: 700 6px "Courier New", monospace; letter-spacing: .1em; }
.module-outcome b { margin-top: 6px; font-size: 9px; line-height: 1.4; }
.module-footer { min-height: 42px; display: flex; align-items: center; gap: 8px; margin: auto -18px 0; padding: 0 17px; background: #f8faf8; border-top: 1px solid #edf0ee; }
.module-footer span { padding-right: 8px; border-right: 1px solid #dfe5e2; color: var(--muted); font-size: 7px; }
.module-footer i { margin-left: auto; color: var(--green); font-style: normal; }
.major-connector { width: 24px; flex: 0 0 24px; display: flex; align-items: center; }
.major-connector span { position: relative; width: 100%; height: 1px; background: #a8b7b2; }
.major-connector span:after { content: ""; position: absolute; right: 0; top: -3px; width: 7px; height: 7px; border-top: 1px solid #a8b7b2; border-right: 1px solid #a8b7b2; transform: rotate(45deg); }
.support-layer { min-height: 78px; display: grid; grid-template-columns: 1.2fr .85fr .85fr; gap: 10px; align-items: center; padding: 11px 13px; border: 1px dashed #c8d4d0; border-radius: 14px; background: #edf1ed; }
.support-layer > div { display: flex; flex-direction: column; padding-left: 9px; }
.support-layer > div small { color: var(--faint); font: 700 7px "Courier New", monospace; letter-spacing: .1em; }
.support-layer > div b { margin-top: 6px; font-size: 10px; }
.support-layer button { min-height: 50px; display: grid; grid-template-columns: 28px 1fr; align-items: center; border: 0; border-radius: 10px; background: white; text-align: left; cursor: pointer; }
.support-layer button > span { grid-row: 1 / 3; align-self: center; color: var(--green); text-align: center; }
.support-layer button > div { display: flex; flex-direction: column; }
.support-layer button b { font-size: 9px; }
.support-layer button small { margin-top: 3px; color: var(--muted); font-size: 7px; }
.overview-footer { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-top: 24px; }
.overview-footer p { display: flex; align-items: center; gap: 10px; margin: 0; color: var(--muted); font-size: 9px; }
.overview-footer p span { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 5px var(--green-soft); }
.overview-footer button { border: 0; border-radius: 10px; padding: 11px 14px; background: var(--navy); color: white; font-size: 8px; cursor: pointer; }

.source-impact-panel { margin-top: 15px; overflow: hidden; border: 1px solid #bdd5cc; border-radius: 16px; background: white; box-shadow: 0 18px 40px rgba(20,50,57,.09); }
.source-impact-panel > header { display: flex; justify-content: space-between; align-items: flex-start; padding: 20px 22px; border-bottom: 1px solid var(--line); }
.source-impact-panel > header small { color: var(--green); font: 700 7px "Courier New", monospace; letter-spacing: .1em; }
.source-impact-panel h2 { margin: 5px 0 0; font-size: 18px; }
.source-impact-panel header p { margin: 3px 0 0; color: var(--muted); font-size: 8px; }
.source-impact-panel header button { border: 0; background: transparent; color: var(--muted); font-size: 8px; cursor: pointer; }
.source-accounting { display: flex; align-items: center; gap: 10px; padding: 14px 22px; background: #f6f9f7; border-bottom: 1px solid var(--line); }
.source-accounting > div { min-width: 115px; display: flex; flex-direction: column; }
.source-accounting strong { font-size: 21px; }
.source-accounting span { color: var(--muted); font-size: 7px; }
.source-accounting i { color: #a8b2af; font-style: normal; }
.source-accounting .mapped strong { color: var(--green); }
.source-accounting .questions strong { color: var(--gold); }
.source-statements { padding: 4px 22px 10px; }
.source-statements article { display: grid; grid-template-columns: 26px 1.4fr 1fr; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #edf0ee; }
.source-statements article > span { width: 23px; height: 23px; display: grid; place-items: center; border-radius: 50%; background: var(--green-soft); color: var(--green); font-size: 8px; font-weight: 800; }
.source-statements article.question > span { background: var(--gold-soft); color: var(--gold); }
.source-statements article > div small { color: var(--faint); font: 700 6px "Courier New", monospace; letter-spacing: .08em; }
.source-statements blockquote { margin: 5px 0 0; font-size: 9px; line-height: 1.45; }
.source-statements article > button { display: flex; justify-content: space-between; gap: 8px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: #f8faf8; color: var(--green); font-size: 8px; text-align: left; cursor: pointer; }
.source-statements article > button i { margin-left: auto; font-style: normal; }
.source-impact-panel > footer { display: flex; align-items: center; gap: 12px; padding: 12px 22px; background: var(--navy); color: white; }
.source-impact-panel footer span { font-size: 8px; font-weight: 750; }
.source-impact-panel footer p { margin: 0; color: #a9bdbe; font-size: 7px; }

.module-detail-head { display: grid; grid-template-columns: auto minmax(380px,1fr) 390px; gap: 24px; align-items: end; }
.back-to-overview { align-self: start; display: flex; gap: 7px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: white; color: var(--muted); font-size: 8px; cursor: pointer; }
.detail-meta { min-width: 0; display: grid; grid-template-columns: 1fr 1.2fr; border-left: 1px solid var(--line); }
.detail-meta > div { display: flex; flex-direction: column; padding-left: 18px; }
.detail-meta > div + div { border-left: 1px solid var(--line); }
.detail-meta small { color: var(--faint); font: 700 6px "Courier New", monospace; letter-spacing: .08em; }
.detail-meta b { margin-top: 7px; font-size: 9px; line-height: 1.35; }
.source-history-strip { min-height: 68px; display: flex; align-items: center; gap: 9px; margin-top: 28px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: white; }
.source-history-strip > div { min-width: 150px; display: flex; flex-direction: column; padding-left: 4px; }
.source-history-strip > div small { color: var(--faint); font: 700 6px "Courier New", monospace; letter-spacing: .08em; }
.source-history-strip > div b { margin-top: 4px; font-size: 9px; }
.source-history-strip > button { min-width: 155px; display: flex; align-items: center; gap: 8px; padding: 7px 8px; border: 1px solid transparent; border-radius: 9px; background: #f5f7f5; cursor: pointer; }
.source-history-strip > button.selected { border-color: #83bba3; background: var(--green-soft); }
.source-history-strip > button small { margin-left: auto; color: var(--muted); font-size: 7px; }
.prd-pill { display: inline-flex; align-items: center; width: fit-content; padding: 4px 6px; border-radius: 6px; font: 700 6px "Courier New", monospace; letter-spacing: .05em; }
.prd-main { background: var(--blue-soft); color: #35606a; }
.prd-roles { background: var(--gold-soft); color: var(--gold); }
.prd-latest { background: var(--green-soft); color: var(--green); }
.history-note { margin-left: auto; color: var(--muted); font-size: 7px; }
.focused-diagram { margin-top: 15px; padding: 23px 24px 17px; border: 1px solid var(--line); border-radius: 16px; background: white; }
.diagram-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
.diagram-head small { color: var(--faint); font: 700 6px "Courier New", monospace; letter-spacing: .1em; }
.diagram-head h2 { margin: 5px 0 0; font-size: 17px; }
.diagram-head p { margin: 1px 0 0; color: var(--muted); font-size: 8px; }
.linear-flow { min-height: 210px; display: flex; align-items: center; justify-content: center; padding-top: 25px; overflow-x: auto; }
.flow-slot { display: flex; align-items: center; transition: opacity .18s ease; }
.linear-flow.filtering .flow-slot.unmatched { opacity: .24; }
.flow-card { position: relative; width: 190px; min-height: 116px; display: flex; flex-direction: column; align-items: flex-start; padding: 14px 15px; border: 1px solid #cad5d1; border-radius: 12px; background: white; text-align: left; cursor: pointer; transition: transform .17s ease, border-color .17s ease, box-shadow .17s ease, opacity .17s ease; }
.flow-card:hover, .flow-card.selected { transform: translateY(-2px); border-color: var(--coral); box-shadow: 0 0 0 3px var(--coral-soft); }
.flow-card.decision { border-color: #d9c18f; background: var(--gold-soft); }
.flow-card.success { border-color: #a9ccbe; background: var(--green-soft); }
.flow-card.warning { border-color: #e7b5a6; background: var(--coral-soft); }
.flow-card.added { border: 2px solid #5ca68b; background: var(--green-soft); }
.flow-card.unmatched { opacity: .24; }
.flow-card > small { color: var(--faint); font: 700 7px "Courier New", monospace; letter-spacing: .08em; }
.flow-card h3 { margin: 24px 0 0; font-size: 11px; }
.flow-card p { margin: 6px 0 0; color: var(--muted); font-size: 8px; line-height: 1.4; }
.flow-card em { position: absolute; right: 8px; top: 8px; padding: 3px 5px; border-radius: 5px; background: var(--green); color: white; font: 700 5px "Courier New", monospace; font-style: normal; }
.flow-link { width: 34px; flex: 0 0 34px; text-align: center; color: #8fa09b; }
.registration-flow { min-height: 310px; position: relative; padding-top: 36px; }
.registration-main { display: flex; align-items: center; justify-content: center; gap: 13px; }
.registration-main > span { color: #8fa09b; }
.yes-path { display: flex; align-items: center; gap: 9px; }
.yes-path > small { color: var(--green); font: 700 6px "Courier New", monospace; letter-spacing: .08em; }
.yes-path > span { color: #8fa09b; }
.registration-branch { position: absolute; left: 42%; bottom: 9px; display: flex; align-items: center; gap: 10px; }
.registration-branch > span { color: var(--green); font-size: 7px; }
.registration-branch > span:last-child { max-width: 105px; line-height: 1.35; }
.branch-origin { position: absolute; left: -19px; top: -45px; }
.branch-origin span { color: var(--green); font: 700 6px "Courier New", monospace; letter-spacing: .07em; white-space: nowrap; }
.branch-origin i { display: block; width: 1px; height: 37px; margin: 4px 0 0 9px; background: #65aa91; }
.flow-legend { display: flex; justify-content: center; gap: 22px; padding-top: 13px; border-top: 1px solid #edf0ee; }
.flow-legend span { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 7px; }

.legend-current { border: 1px solid #a8b7b2; background: white; }
.legend-decision { border: 1px solid #c7a85f; background: var(--gold-soft); }
.legend-added { border: 2px solid #5ca68b; background: var(--green-soft); }
.node-evidence { min-height: 78px; margin-top: 14px; overflow: hidden; border: 1px dashed #c8d3cf; border-radius: 14px; background: white; }
.node-evidence.open { display: grid; grid-template-columns: .8fr 1.35fr; border-style: solid; }
.atlas-reading, .source-reading { padding: 19px 21px; }
.atlas-reading { background: #f5f8f6; border-right: 1px solid var(--line); }
.atlas-reading small, .source-reading > div small { color: var(--coral); font: 700 7px "Courier New", monospace; letter-spacing: .09em; }
.atlas-reading h3 { margin: 5px 0 0; font-size: 14px; }
.atlas-reading p { margin: 7px 0 0; color: var(--muted); font-size: 9px; line-height: 1.55; }
.source-reading > div { display: flex; justify-content: space-between; }
.source-reading > div small { color: var(--green); }
.source-reading > div button { border: 0; background: transparent; color: var(--muted); font-size: 7px; cursor: pointer; }
.source-reading blockquote { margin: 12px 0 10px; font-size: 11px; line-height: 1.55; font-weight: 600; }
.source-reading footer { display: flex; justify-content: space-between; color: var(--muted); font-size: 7px; }
.source-reading footer button { border: 0; background: transparent; color: var(--green); font-size: 7px; font-weight: 700; cursor: pointer; }
.evidence-placeholder { min-height: 76px; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); }
.evidence-placeholder > span { color: var(--coral); }
.evidence-placeholder p { margin: 0; font-size: 8px; line-height: 1.5; }
.evidence-placeholder b { color: var(--ink); }

.fact-summary { min-width: 220px; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 13px; background: white; }
.fact-summary strong { grid-row: 1 / 3; font-size: 26px; }
.fact-summary span { font-size: 9px; font-weight: 700; }
.fact-summary i { margin-top: 3px; color: var(--green); font-size: 7px; font-style: normal; }
.facts-grid { display: grid; gap: 10px; margin-top: 34px; }
.fact-card { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: white; }
.fact-card.open { border-color: #b3cbc2; box-shadow: 0 10px 25px rgba(26,52,58,.06); }
.fact-card-head { width: 100%; min-height: 88px; display: grid; grid-template-columns: 42px 1fr auto; gap: 15px; align-items: center; padding: 13px 18px; border: 0; background: white; text-align: left; cursor: pointer; }
.fact-card-head > span { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; color: var(--coral); font: 700 8px "Courier New", monospace; }
.fact-card-head h2 { margin: 0; font-size: 14px; }
.fact-card-head p { margin: 5px 0 0; color: var(--muted); font-size: 9px; }
.fact-sources { display: flex; align-items: center; gap: 14px; }
.fact-sources b { color: var(--green); font-size: 8px; }
.fact-sources i { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 8px; background: #f0f3f1; color: var(--muted); font-style: normal; }
.fact-card-body { display: grid; grid-template-columns: 1.35fr .8fr; border-top: 1px solid var(--line); background: #f8faf8; }
.fact-current, .fact-provenance { padding: 18px 22px; }
.fact-provenance { border-left: 1px solid var(--line); background: white; }
.fact-current > small, .fact-provenance > small { color: var(--faint); font: 700 7px "Courier New", monospace; letter-spacing: .08em; }
.fact-current p { display: flex; align-items: flex-start; gap: 8px; margin: 11px 0 0; font-size: 9px; line-height: 1.45; }
.fact-current p span { width: 17px; height: 17px; flex: 0 0 17px; display: grid; place-items: center; border-radius: 50%; background: var(--green-soft); color: var(--green); font-size: 7px; }
.fact-provenance > button { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 9px; background: #f8faf8; cursor: pointer; }
.fact-provenance > button span:last-child { color: var(--green); font-size: 7px; }

.latest-heading { align-items: center; }
.latest-summary { min-width: 470px; display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; padding: 13px; border: 1px solid #b9d5ca; border-radius: 14px; background: #eef8f3; }
.latest-summary > span { grid-column: 1 / -1; color: var(--green); font: 700 7px "Courier New", monospace; letter-spacing: .1em; }
.latest-summary > div { display: flex; flex-direction: column; padding: 9px 10px; border-radius: 9px; background: white; }
.latest-summary strong { font-size: 19px; }
.latest-summary small { margin-top: 4px; color: var(--muted); font-size: 7px; line-height: 1.3; }
.change-destination { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 28px; padding: 14px 16px; border: 1px solid #afd0c1; border-radius: 13px; background: #f2faf6; }
.destination-path { display: flex; flex-direction: column; }
.destination-path span { color: var(--green); font: 700 7px "Courier New", monospace; letter-spacing: .09em; }
.destination-path b { margin-top: 5px; font-size: 10px; }
.change-destination > button { border: 0; background: transparent; color: var(--green); font-size: 8px; font-weight: 700; cursor: pointer; }
.latest-changes { display: grid; grid-template-columns: 1.3fr .8fr; gap: 13px; margin-top: 14px; }
.change-card { display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 15px; background: white; }
.change-card-label { display: grid; grid-template-columns: 34px 1fr; gap: 11px; align-items: center; padding: 17px 19px; border-bottom: 1px solid var(--line); }
.change-card-label > span { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 9px; background: var(--green-soft); color: var(--green); font: 700 8px "Courier New", monospace; }
.change-card.question .change-card-label > span { background: var(--gold-soft); color: var(--gold); }
.change-card-label > div { display: flex; flex-direction: column; }
.change-card-label small { color: var(--green); font: 700 6px "Courier New", monospace; letter-spacing: .08em; }
.change-card.question .change-card-label small { color: var(--gold); }
.change-card-label b { margin-top: 5px; font-size: 11px; }
.before-after { display: grid; grid-template-columns: 1fr auto 1fr; gap: 13px; align-items: center; padding: 18px 20px; }
.before-after > div { min-height: 77px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #f8faf8; }
.before-after > div:last-child { border-color: #afd0c1; background: var(--green-soft); }
.before-after small { color: var(--faint); font: 700 6px "Courier New", monospace; letter-spacing: .08em; }
.before-after p { margin: 8px 0 0; font-size: 9px; line-height: 1.45; }
.before-after > span { color: var(--green); }
.added-steps { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 20px 18px; }
.added-steps > span { color: var(--green); font: 700 6px "Courier New", monospace; }
.added-steps b { padding: 9px 11px; border: 1px solid #90c2ac; border-radius: 9px; background: var(--green-soft); font-size: 8px; }
.added-steps i { color: var(--green); font-style: normal; }
.change-card > footer { min-height: 48px; display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding: 9px 19px; border-top: 1px solid var(--line); background: #f8faf8; }
.change-card footer button { border: 0; background: transparent; color: var(--green); font-size: 7px; font-weight: 700; cursor: pointer; }
.change-card.question blockquote { margin: 18px 20px 0; padding: 13px 14px; border-left: 3px solid #d3a34d; background: var(--gold-soft); font-size: 10px; line-height: 1.55; font-weight: 600; }
.change-card.question > p { margin: 12px 20px 18px; color: var(--muted); font-size: 8px; line-height: 1.5; }
.latest-rule { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: white; }
.latest-rule > span { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: var(--green); color: white; font-size: 9px; }
.latest-rule p { margin: 0; color: var(--muted); font-size: 8px; line-height: 1.5; }
.latest-rule b { color: var(--ink); }

.modal-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 30px; background: rgba(10,32,38,.75); backdrop-filter: blur(5px); }
.source-modal { width: min(860px,100%); max-height: calc(100vh - 60px); overflow: auto; border-radius: 16px; background: #e9eeeb; box-shadow: 0 30px 80px rgba(0,0,0,.3); }
.source-modal > header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 13px 17px; background: var(--navy); color: white; }
.source-modal > header > div { display: flex; flex-direction: column; }
.source-modal header small { color: #93adaf; font: 700 6px "Courier New", monospace; letter-spacing: .1em; }
.source-modal header b { margin-top: 4px; font-size: 9px; }
.source-modal header button { border: 0; background: transparent; color: white; font-size: 8px; cursor: pointer; }
.fake-page { position: relative; width: min(620px,calc(100% - 36px)); min-height: 700px; margin: 18px auto; padding: 56px 62px; background: white; box-shadow: 0 7px 20px rgba(20,40,44,.13); }
.fake-brand { color: var(--coral); font-size: 10px; font-weight: 800; letter-spacing: .2em; }
.fake-page h2 { margin: 65px 0 20px; font-size: 21px; }
.fake-page p { color: var(--muted); font-size: 10px; line-height: 1.8; }
.fake-page blockquote { margin: 25px -15px; padding: 15px 17px; border-left: 3px solid var(--coral); background: var(--coral-soft); font-size: 13px; line-height: 1.6; font-weight: 650; }
.fake-page > i { position: absolute; right: 30px; bottom: 25px; color: var(--faint); font-size: 8px; font-style: normal; }

@media (max-width: 1180px) {
  .page-heading, .latest-heading { align-items: flex-start; flex-direction: column; }
  .overview-summary, .latest-summary { min-width: 0; width: 100%; }
  .major-flow { overflow-x: auto; padding-bottom: 12px; }
  .major-slot { flex: 0 0 225px; }
  .module-detail-head { grid-template-columns: auto 1fr; }
  .detail-meta { grid-column: 2; width: 100%; margin-top: 5px; }
  .registration-flow { overflow-x: auto; min-height: 330px; }
  .registration-main { min-width: 920px; justify-content: flex-start; }
  .registration-branch { left: 415px; min-width: 650px; }
}

@media (max-width: 850px) {
  .atlas-shell { --sidebar-width: 76px; }
  .sidebar-open { --sidebar-width: 76px; }
  .atlas-sidebar { width: 76px; }
  .sidebar-brand { padding: 0 19px; }
  .sidebar-brand > div:nth-child(2), .project-switcher > div, .project-switcher > i, .sidebar-label, .nav-item > div, .nav-item > em, .source-toggle > b, .source-toggle > i, .source-list, .sidebar-footer > div { display: none; }
  .collapse-button { display: none; }
  .project-switcher-wrap { padding: 15px 10px; }
  .project-switcher { justify-content: center; min-height: 54px; padding: 7px; border: 0; background: transparent; }
  .sidebar-section { padding: 10px; }
  .nav-item { justify-content: center; min-height: 50px; padding: 6px; }
  .content-header { padding: 0 18px; }
  .view-page { width: calc(100% - 30px); padding-top: 28px; }
  .support-layer { grid-template-columns: 1fr; }
  .overview-footer { align-items: flex-start; flex-direction: column; }
  .module-detail-head { grid-template-columns: 1fr; }
  .back-to-overview { width: fit-content; }
  .detail-meta { grid-column: 1; border-left: 0; border-top: 1px solid var(--line); padding-top: 13px; }
  .source-history-strip { overflow-x: auto; }
  .source-history-strip .history-note { display: none; }
  .node-evidence.open { grid-template-columns: 1fr; }
  .atlas-reading { border-right: 0; border-bottom: 1px solid var(--line); }
  .fact-card-body { grid-template-columns: 1fr; }
  .fact-provenance { border-left: 0; border-top: 1px solid var(--line); }
  .latest-summary { grid-template-columns: 1fr 1fr; }
  .latest-summary > span { grid-column: 1 / -1; }
  .latest-changes { grid-template-columns: 1fr; }
  .source-statements article { grid-template-columns: 26px 1fr; }
  .source-statements article > button { grid-column: 2; }
}

@media (max-width: 560px) {
  .content-header { height: auto; min-height: 67px; align-items: flex-start; flex-direction: column; padding-top: 13px; padding-bottom: 10px; }
  .header-actions { width: 100%; justify-content: flex-end; }
  .active-filter { max-width: 240px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .page-heading h1, .detail-title h1 { font-size: 33px; }
  .overview-summary { overflow-x: auto; }
  .overview-summary > div { min-width: 100px; }
  .impact-banner { grid-template-columns: 31px 1fr; }
  .impact-banner button { grid-column: 2; justify-self: start; }
  .source-accounting { overflow-x: auto; }
  .fact-card-head { grid-template-columns: 34px 1fr; }
  .fact-card-head > span { width: 32px; height: 32px; }
  .fact-sources { grid-column: 2; justify-content: space-between; }
  .latest-summary { grid-template-columns: 1fr; }
  .latest-summary > span { grid-column: 1; }
  .change-destination { align-items: flex-start; flex-direction: column; }
  .before-after { grid-template-columns: 1fr; }
  .before-after > span { transform: rotate(90deg); justify-self: center; }
  .added-steps { align-items: stretch; flex-direction: column; }
  .added-steps i { transform: rotate(90deg); align-self: center; }
  .fake-page { min-height: 600px; padding: 42px 28px; }
}

/* Incremental PRD lens and semantic workflow paging */
.content-header { overflow: visible; }
.header-actions { position: relative; z-index: 40; }
.mode-strip { position: relative; z-index: 10; min-height: 31px; display: flex; align-items: center; gap: 9px; padding: 0 34px; border-bottom: 1px solid var(--line); background: #f8faf8; color: var(--muted); font-size: 8px; line-height: 1.35; }
.mode-strip > span { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: #a7b2ae; }
.mode-strip > span.selected { background: var(--green); box-shadow: 0 0 0 4px var(--green-soft); }

.prd-filter-wrap { position: relative; }
.prd-filter-button { min-width: 194px; height: 48px; display: grid; grid-template-columns: 27px 1fr 16px; gap: 8px; align-items: center; padding: 6px 10px; border: 1px solid var(--line); border-radius: 12px; background: white; text-align: left; cursor: pointer; box-shadow: 0 3px 9px rgba(22,49,56,.03); }
.prd-filter-button.active { border-color: #82b9a2; background: var(--green-soft); }
.prd-filter-button .filter-icon { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 8px; background: var(--navy); color: white; }
.prd-filter-button > span:nth-child(2) { min-width: 0; display: flex; flex-direction: column; }
.prd-filter-button small { color: var(--faint); font: 700 6px "Courier New", monospace; letter-spacing: .1em; }
.prd-filter-button b { margin-top: 3px; overflow: hidden; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
.prd-filter-button i { color: var(--muted); font-size: 8px; font-style: normal; }
.prd-filter-popover { position: absolute; right: 0; top: 55px; z-index: 200; width: 380px; overflow: hidden; border: 1px solid #cfd9d5; border-radius: 15px; background: white; box-shadow: 0 24px 70px rgba(11,35,42,.23); }
.prd-filter-popover > header { display: flex; align-items: flex-start; justify-content: space-between; padding: 17px 18px 14px; border-bottom: 1px solid var(--line); background: #f7f9f7; }
.prd-filter-popover header > div { display: flex; flex-direction: column; }
.prd-filter-popover header small { color: var(--green); font: 700 6px "Courier New", monospace; letter-spacing: .1em; }
.prd-filter-popover header b { margin-top: 5px; font-size: 12px; }
.prd-filter-popover header button { border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.filter-option { width: 100%; min-height: 57px; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; padding: 8px 18px; border: 0; border-bottom: 1px solid #edf0ee; background: white; text-align: left; cursor: pointer; }
.filter-option:hover { background: #f8faf8; }
.filter-option > span { width: 20px; height: 20px; display: grid; place-items: center; border: 1px solid #c5d0cc; border-radius: 6px; color: white; font-size: 8px; }
.filter-option.selected > span { border-color: var(--green); background: var(--green); }
.filter-option > div { display: flex; flex-direction: column; }
.filter-option b { font-size: 9px; }
.filter-option small { margin-top: 3px; color: var(--muted); font-size: 7px; }
.hide-toggle { position: relative; min-height: 67px; display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: center; padding: 10px 18px; background: #f8faf8; cursor: pointer; }
.hide-toggle input { position: absolute; z-index: 2; left: 18px; top: 23px; width: 36px; height: 21px; margin: 0; opacity: 0; cursor: pointer; }
.hide-toggle > span { position: relative; width: 36px; height: 21px; border-radius: 20px; background: #c8d1ce; transition: background .2s ease; }
.hide-toggle > span:after { content: ""; position: absolute; left: 3px; top: 3px; width: 15px; height: 15px; border-radius: 50%; background: white; box-shadow: 0 1px 4px rgba(0,0,0,.18); transition: transform .2s ease; }
.hide-toggle input:checked + span { background: var(--green); }
.hide-toggle input:checked + span:after { transform: translateX(15px); }
.hide-toggle > div { display: flex; flex-direction: column; }
.hide-toggle b { font-size: 9px; }
.hide-toggle small { margin-top: 3px; color: var(--muted); font-size: 7px; }
.hide-toggle.disabled { opacity: .45; cursor: not-allowed; }
.prd-filter-popover > footer { display: grid; grid-template-columns: 1fr auto; gap: 13px; align-items: center; padding: 12px 15px; background: var(--navy); color: white; }
.prd-filter-popover footer p { margin: 0; color: #b6c7c8; font-size: 7px; line-height: 1.45; }
.prd-filter-popover footer button { padding: 7px 11px; border: 0; border-radius: 8px; background: white; color: var(--navy); font-size: 8px; font-weight: 700; cursor: pointer; }

.prd-foundation { background: var(--blue-soft); color: #35606a; }
.prd-roles { background: var(--gold-soft); color: var(--gold); }
.prd-waiting { background: var(--green-soft); color: var(--green); }

.journey-grid { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 27px; margin: 44px 0 24px; }
.journey-stage { position: relative; min-width: 0; transition: opacity .2s ease, filter .2s ease; }
.journey-stage > button { width: 100%; min-height: 286px; display: flex; flex-direction: column; overflow: hidden; padding: 20px 18px 0; border: 1px solid #d7dfdc; border-radius: 16px; background: white; text-align: left; cursor: pointer; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
.journey-stage > button:hover { transform: translateY(-4px); border-color: #9db3ab; box-shadow: 0 18px 35px rgba(23,48,56,.10); }
.journey-grid.filtering .journey-stage.unmatched { opacity: .3; filter: grayscale(.75); }
.journey-grid.filtering .journey-stage.matched > button, .journey-stage.matched > button:focus-visible { border-color: #64a98f; box-shadow: 0 0 0 4px var(--green-soft); }
.journey-stage .module-top em { font-size: 5px; }
.journey-stage .module-copy h2 { min-height: 55px; font-size: 15px; }
.journey-stage .module-footer { width: calc(100% + 36px); justify-content: space-between; }
.journey-stage .module-footer i { color: var(--green); font-size: 7px; }
.stage-arrow { position: absolute; right: -21px; top: 50%; z-index: 2; color: #95a59f; font-size: 16px; }
.support-layer.unmatched { opacity: .3; filter: grayscale(.75); }

.semantic-pager { position: sticky; top: 0; z-index: 15; display: grid; grid-template-columns: auto 36px minmax(260px,440px) 36px 1fr; gap: 8px; align-items: center; margin: -42px -32px 32px; padding: 12px 32px; border-bottom: 1px solid var(--line); background: rgba(242,244,240,.96); backdrop-filter: blur(12px); }
.pager-back, .pager-arrow { height: 38px; border: 1px solid var(--line); border-radius: 9px; background: white; color: var(--muted); font-size: 8px; cursor: pointer; }
.pager-back { padding: 0 12px; }
.pager-arrow { width: 36px; font-size: 11px; }
.pager-arrow:disabled { opacity: .4; cursor: not-allowed; }
.page-picker-wrap { position: relative; }
.page-picker-button { width: 100%; height: 48px; display: grid; grid-template-columns: 1fr 18px; gap: 10px; align-items: center; padding: 6px 12px; border: 1px solid #bfd0ca; border-radius: 10px; background: white; text-align: left; cursor: pointer; box-shadow: 0 4px 12px rgba(19,46,53,.05); }
.page-picker-button > span { min-width: 0; display: flex; flex-direction: column; }
.page-picker-button small { color: var(--green); font: 700 6px "Courier New", monospace; letter-spacing: .08em; }
.page-picker-button b { margin-top: 4px; overflow: hidden; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.page-picker-button i { color: var(--muted); font-style: normal; }
.page-picker-menu { position: absolute; left: 0; top: 55px; z-index: 30; width: min(520px,80vw); max-height: 65vh; overflow: auto; border: 1px solid #ccd7d3; border-radius: 13px; background: white; box-shadow: 0 22px 60px rgba(13,37,44,.2); }
.page-picker-menu > header { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; padding: 13px 15px; border-bottom: 1px solid var(--line); background: #f8faf8; }
.page-picker-menu header b { font-size: 10px; }
.page-picker-menu header small { color: var(--muted); font-size: 7px; }
.page-picker-group > span { display: block; padding: 10px 15px 6px; color: var(--faint); font: 700 6px "Courier New", monospace; letter-spacing: .08em; }
.page-picker-group > button { width: 100%; min-height: 43px; display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; padding: 6px 15px; border: 0; border-top: 1px solid #f0f2f1; background: white; text-align: left; cursor: pointer; }
.page-picker-group > button:hover, .page-picker-group > button.current { background: #f2f7f4; }
.page-picker-group > button > b { color: var(--coral); font: 700 7px "Courier New", monospace; }
.page-picker-group > button > span { font-size: 8px; }
.page-picker-group > button > i { padding: 4px 6px; border-radius: 6px; background: var(--green-soft); color: var(--green); font: 700 5px "Courier New", monospace; font-style: normal; }
.affected-pager { display: flex; align-items: center; justify-content: flex-end; gap: 7px; }
.affected-pager small { margin-right: 5px; color: var(--green); font-size: 7px; font-weight: 700; }
.affected-pager button { height: 31px; padding: 0 9px; border: 1px solid #b8d2c7; border-radius: 8px; background: var(--green-soft); color: var(--green); font-size: 7px; cursor: pointer; }

.module-detail-head { grid-template-columns: minmax(380px,1fr) 430px; }
.detail-meta { grid-column: auto; }
.source-history-strip > button { cursor: default; }
.linear-flow { flex-wrap: wrap; row-gap: 18px; }
.linear-flow.isolated { min-height: 180px; }
.flow-card.matched { border-color: #58a084; box-shadow: 0 0 0 4px var(--green-soft); }
.flow-card.unmatched { opacity: .27; filter: grayscale(.6); }
.flow-card.context-anchor { border-style: dashed; border-color: #9caaa5; background: #f4f6f4; opacity: .7; }
.flow-card .context-label { background: #84948e; }
.flow-card .node-prds { width: 100%; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; padding-top: 8px; border-top: 1px solid rgba(65,110,93,.15); }
.flow-card .node-prds .prd-pill { font-size: 5px; }
.legend-context { border: 1px dashed #8c9b96; background: #f4f6f4; }
.evidence-prds { display: flex; gap: 5px; }
.empty-state { min-height: 180px; display: grid; place-content: center; text-align: center; }
.empty-state b { font-size: 12px; }
.empty-state p { margin: 6px 0 0; color: var(--muted); font-size: 8px; }
.page-continuation { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding-top: 15px; border-top: 1px solid var(--line); }
.page-continuation button { border: 0; background: transparent; color: var(--green); font-size: 8px; font-weight: 700; cursor: pointer; }
.page-continuation span { color: var(--muted); font-size: 7px; }

.facts-grid.filtering .fact-card.unmatched, .ces-grid.filtering .policy-card.unmatched, .change-timeline.filtering .change-group.unmatched { opacity: .3; filter: grayscale(.75); }
.fact-card.matched { border-color: #8fbea9; }
.fact-current p.row-matched { padding: 8px; border-radius: 8px; background: var(--green-soft); }
.fact-source-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding: 9px; border: 1px solid var(--line); border-radius: 9px; background: #f8faf8; }
.fact-source-row.selected { border-color: #82b89f; background: var(--green-soft); }
.fact-source-row > span:last-child { color: var(--muted); font-size: 7px; }

.ces-summary { display: grid; grid-template-columns: repeat(3,105px); gap: 8px; }
.ces-summary > div { display: flex; flex-direction: column; padding: 12px 13px; border: 1px solid var(--line); border-radius: 12px; background: white; }
.ces-summary > div.attention { border-color: #e1c583; background: var(--gold-soft); }
.ces-summary strong { font-size: 22px; }
.ces-summary span { margin-top: 4px; color: var(--muted); font-size: 7px; }
.ces-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; margin-top: 34px; }
.policy-card { display: flex; flex-direction: column; min-height: 265px; padding: 19px 20px 0; border: 1px solid var(--line); border-radius: 15px; background: white; transition: opacity .2s ease, filter .2s ease; }
.policy-card.matched { border-color: #80b59e; }
.policy-card.review { border-color: #dec17c; background: #fffdf8; }
.policy-card > header { display: flex; align-items: center; justify-content: space-between; }
.policy-card header > span { color: var(--coral); font: 700 7px "Courier New", monospace; letter-spacing: .08em; }
.policy-card header > em { padding: 5px 7px; border-radius: 7px; background: var(--green-soft); color: var(--green); font: 700 6px "Courier New", monospace; font-style: normal; }
.policy-card.review header > em { background: var(--gold-soft); color: var(--gold); }
.policy-card h2 { margin: 23px 0 0; font-size: 15px; letter-spacing: -.02em; }
.policy-card > p { margin: 8px 0 0; color: var(--muted); font-size: 9px; line-height: 1.5; }
.policy-rule { margin-top: 16px; padding: 11px 12px; border-radius: 9px; background: #f5f7f5; display: flex; flex-direction: column; }
.policy-rule small { color: var(--faint); font: 700 6px "Courier New", monospace; letter-spacing: .08em; }
.policy-rule b { margin-top: 6px; font-size: 8px; line-height: 1.45; }
.policy-card > footer { min-height: 51px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: auto -20px 0; padding: 9px 18px; border-top: 1px solid var(--line); background: #f8faf8; }
.policy-card footer > div { display: flex; gap: 4px; }
.policy-card footer button { border: 0; background: transparent; color: var(--green); font-size: 7px; font-weight: 700; cursor: pointer; }

.changes-summary { min-width: 190px; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; padding: 13px 15px; border: 1px solid var(--line); border-radius: 13px; background: white; }
.changes-summary strong { grid-row: 1 / 3; font-size: 27px; }
.changes-summary span { font-size: 9px; font-weight: 700; }
.changes-summary i { margin-top: 3px; color: var(--green); font-size: 7px; font-style: normal; }
.change-timeline { display: grid; gap: 16px; margin-top: 34px; }
.change-group { overflow: hidden; border: 1px solid var(--line); border-radius: 15px; background: white; transition: opacity .2s ease, filter .2s ease; }
.change-group.matched { border-color: #9fc6b5; }
.change-group > header { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px; border-bottom: 1px solid var(--line); background: #f7f9f7; }
.change-group header > div { display: flex; align-items: center; gap: 10px; }
.change-group header b { font-size: 10px; }
.change-group header small { color: var(--muted); font-size: 7px; }
.change-group header > span { color: var(--muted); font-size: 7px; }
.change-row { display: grid; grid-template-columns: 82px 1fr auto; gap: 16px; align-items: center; padding: 16px 18px; border-bottom: 1px solid #edf0ee; }
.change-row:last-child { border-bottom: 0; }
.change-row > span { width: fit-content; padding: 6px 8px; border-radius: 7px; background: var(--green-soft); color: var(--green); font: 700 6px "Courier New", monospace; }
.change-row.question > span { background: var(--gold-soft); color: var(--gold); }
.change-row h2 { margin: 0; font-size: 11px; }
.change-row p { margin: 5px 0 0; color: var(--muted); font-size: 8px; line-height: 1.45; }
.change-row div > small { display: block; margin-top: 7px; color: var(--green); font-size: 7px; }
.change-row > button { border: 0; background: transparent; color: var(--green); font-size: 7px; font-weight: 700; cursor: pointer; }
.change-row > i { color: var(--muted); font-size: 7px; font-style: normal; }

.source-review-modal { width: min(940px,100%); max-height: calc(100vh - 60px); overflow: auto; border-radius: 16px; background: white; box-shadow: 0 30px 80px rgba(0,0,0,.3); }
.source-review-modal > header { position: sticky; top: 0; z-index: 2; display: flex; align-items: flex-start; justify-content: space-between; padding: 17px 20px; background: var(--navy); color: white; }
.source-review-modal header > div { display: flex; flex-direction: column; }
.source-review-modal header small { color: #9db1b3; font: 700 6px "Courier New", monospace; letter-spacing: .1em; }
.source-review-modal header h2 { margin: 5px 0 0; font-size: 17px; }
.source-review-modal header p { margin: 4px 0 0; color: #b6c6c7; font-size: 8px; }
.source-review-modal header button { border: 0; background: transparent; color: white; font-size: 8px; cursor: pointer; }
.source-review-list { padding: 4px 20px 10px; }
.source-review-list article { display: grid; grid-template-columns: 28px 1fr auto; gap: 13px; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--line); }
.source-review-list article > span { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 50%; background: var(--green-soft); color: var(--green); font-size: 8px; font-weight: 800; }
.source-review-list article.question > span { background: var(--gold-soft); color: var(--gold); }
.source-review-list article > div { display: flex; flex-direction: column; }
.source-review-list small { color: var(--faint); font: 700 6px "Courier New", monospace; letter-spacing: .08em; }
.source-review-list blockquote { margin: 7px 0; font-size: 9px; line-height: 1.45; }
.source-review-list b { color: var(--green); font-size: 7px; }
.source-review-list article > button { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #f8faf8; color: var(--green); font-size: 7px; cursor: pointer; }
.source-review-modal > footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 13px 20px; background: #f3f6f4; }
.source-review-modal footer p { margin: 0; color: var(--muted); font-size: 7px; }
.source-review-modal footer button { padding: 9px 12px; border: 0; border-radius: 9px; background: var(--green); color: white; font-size: 7px; font-weight: 700; cursor: pointer; }

@media (max-width: 1320px) {
  .journey-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
  .journey-stage .stage-arrow { display: none; }
  .semantic-pager { grid-template-columns: auto 36px minmax(250px,1fr) 36px; }
  .affected-pager { grid-column: 1 / -1; justify-content: flex-start; }
}

@media (max-width: 900px) {
  .mode-strip { padding-left: 18px; padding-right: 18px; }
  .journey-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .semantic-pager { position: static; margin: -28px -15px 28px; padding: 10px 15px; grid-template-columns: auto 32px 1fr 32px; }
  .pager-arrow { width: 32px; }
  .module-detail-head { grid-template-columns: 1fr; }
  .ces-grid { grid-template-columns: 1fr; }
  .ces-summary { width: 100%; grid-template-columns: repeat(3,1fr); }
}

@media (max-width: 620px) {
  .content-header { overflow: visible; }
  .header-actions { justify-content: space-between; }
  .prd-filter-button { min-width: min(240px,calc(100vw - 155px)); }
  .prd-filter-popover { position: fixed; top: 118px; right: 12px; left: 88px; width: auto; max-height: calc(100vh - 135px); overflow: auto; }
  .journey-grid { grid-template-columns: 1fr; }
  .journey-stage > button { min-height: 250px; }
  .semantic-pager { grid-template-columns: 32px 1fr 32px; }
  .pager-back { grid-column: 1 / -1; width: fit-content; }
  .affected-pager { overflow-x: auto; }
  .page-picker-menu { width: calc(100vw - 110px); }
  .module-detail-head { display: grid; }
  .module-detail-head .detail-meta { grid-template-columns: 1fr; }
  .detail-meta > div + div { margin-top: 10px; padding-top: 10px; border-left: 0; border-top: 1px solid var(--line); }
  .linear-flow { justify-content: flex-start; flex-wrap: nowrap; }
  .ces-summary { grid-template-columns: 1fr; }
  .change-row { grid-template-columns: 1fr; }
  .change-group header > div { align-items: flex-start; flex-direction: column; }
  .source-review-list article { grid-template-columns: 28px 1fr; }
  .source-review-list article > button { grid-column: 2; width: fit-content; }
  .source-review-modal > footer { align-items: flex-start; flex-direction: column; }
}
</style>
