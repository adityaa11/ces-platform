# Additive, disposable override for IDSER-012-01-03-02 only.  It uses a
# distinct Compose project name and host ports, leaving atlas-perception-lab
# and its volumes untouched.
services:
  postgres:
    ports: !override
      - "127.0.0.1:35432:5432"
  atlas:
    ports: !override
      - "127.0.0.1:33011:3001"
    environment:
      ATLAS_D1_PERCEPTION_CAPABILITY_IDENTITY: docling-digital-pdf:atlas-digital-pdf-run-003-capture-v1
      BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:33011
  agents-bridge:
    ports: !override
      - "127.0.0.1:33012:3002"
    environment:
      AGENTS_BRIDGE_QUALIFICATION_ONLY: "true"
