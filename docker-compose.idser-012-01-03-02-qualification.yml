  agents-bridge-worker:
    environment:
      AGENTS_BRIDGE_QUALIFICATION_ONLY: "true"
      AGENTS_BRIDGE_QUALIFIED_ROUTES: >-
        [{"routeId":"docling-run-003-capture","capability":"atlas.document.perceive","providerId":"docling","modelOrProcessorId":"docling-slim-2.132.0","adapterVersion":"docling-serve-adapter-v1","qualificationVersion":"idser-012-01-03-02-local","qualificationRef":"qualification://idser-012-01-03-02-local","workClass":"local_processor","enabled":true,"extensions":{"serviceVersion":"1.36.0","optionProfile":"atlas-digital-pdf-run-003-capture-v1","capabilityIdentity":"docling-digital-pdf:atlas-digital-pdf-run-003-capture-v1","imageDigest":"sha256:4ba36cb322283e3851d2a6c5f347dd1cc515d7afb8ea5cc1577da8b5bfe2fea7"}}]
