services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas_dev}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas_local_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  atlas:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ATLAS_DOCKER: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas_local_dev_only}@postgres:5432/${POSTGRES_DB:-atlas_dev}
      ATLAS_APP_PASSWORD: ${ATLAS_APP_PASSWORD:-atlas_app_local_dev_only}
      AGENTS_BRIDGE_PASSWORD: ${AGENTS_BRIDGE_PASSWORD:-agents_bridge_local_dev_only}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-replace_with_a_local_only_32_character_or_longer_secret}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3001}
    ports:
      - "127.0.0.1:${ATLAS_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  agents-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGENTS_BRIDGE_HOST: 0.0.0.0
      AGENTS_BRIDGE_PORT: 3002
      AGENTS_BRIDGE_VERSION: 0.1.0
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_STRUCTURED_MODEL: ${MISTRAL_STRUCTURED_MODEL:-mistral-large-3-25-12}
      MISTRAL_CHAT_MODEL: ${MISTRAL_CHAT_MODEL:-mistral-small-4-0-26-03}
      MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL:-mistral-ocr-4-1}
      MISTRAL_ZDR_APPROVED: ${MISTRAL_ZDR_APPROVED:-false}
      MISTRAL_MAX_DOCUMENT_BYTES: ${MISTRAL_MAX_DOCUMENT_BYTES:-20971520}
      MISTRAL_MAX_REQUEST_BYTES: ${MISTRAL_MAX_REQUEST_BYTES:-2097152}
      MISTRAL_MAX_RESPONSE_BYTES: ${MISTRAL_MAX_RESPONSE_BYTES:-10485760}
      MISTRAL_MAX_STREAM_BYTES: ${MISTRAL_MAX_STREAM_BYTES:-10485760}
      MISTRAL_TIMEOUT_MS: ${MISTRAL_TIMEOUT_MS:-30000}
      MISTRAL_RETRY_MAX_ATTEMPTS: ${MISTRAL_RETRY_MAX_ATTEMPTS:-2}
      MISTRAL_RETRY_DELAY_MS: ${MISTRAL_RETRY_DELAY_MS:-250}
    command: ["sh", "-c", "exec corepack pnpm --filter @atlas/agents-bridge start"]
    ports:
      - "127.0.0.1:${AGENTS_BRIDGE_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  agents-bridge-worker:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      atlas:
        condition: service_healthy
      agents-bridge:
        condition: service_healthy
    environment:
      AGENTS_BRIDGE_DATABASE_URL: postgresql://agents_bridge:${AGENTS_BRIDGE_PASSWORD:-agents_bridge_local_dev_only}@postgres:5432/${POSTGRES_DB:-atlas_dev}
      AGENTS_BRIDGE_WORKER_CONCURRENCY: ${AGENTS_BRIDGE_WORKER_CONCURRENCY:-2}
      AGENTS_BRIDGE_JOB_TIMEOUT_SECONDS: ${AGENTS_BRIDGE_JOB_TIMEOUT_SECONDS:-30}
      AGENTS_BRIDGE_JOB_RETRY_LIMIT: ${AGENTS_BRIDGE_JOB_RETRY_LIMIT:-2}
      AGENTS_BRIDGE_JOB_RETRY_DELAY_SECONDS: ${AGENTS_BRIDGE_JOB_RETRY_DELAY_SECONDS:-1}
      AGENTS_BRIDGE_WORKER_SHUTDOWN_TIMEOUT_MS: ${AGENTS_BRIDGE_WORKER_SHUTDOWN_TIMEOUT_MS:-15000}
    # Run the Node worker directly so Docker SIGTERM reaches its shutdown handler.
    command: ["node", "apps/agents-bridge/node_modules/jiti/lib/jiti-cli.mjs", "apps/agents-bridge/src/worker-main.ts"]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/agents-bridge-worker.ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
